<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Management - SRG Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Poppins', sans-serif; }
        
        .table-container { 
            overflow-x: auto; 
            -webkit-overflow-scrolling: touch;
        }
        
        .action-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-50">

<div class="max-w-7xl mx-auto p-4 md:p-8">

    <!-- Header with Back Button -->
    <div class="bg-white rounded-3xl shadow-xl p-6 mb-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
            
            <!-- Back + Title -->
            <div class="flex items-center gap-4">
                <button onclick="goBack()" 
                        class="flex items-center gap-2 px-6 py-3 text-gray-700 hover:bg-gray-100 rounded-2xl transition-all hover:text-blue-600 font-medium">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back</span>
                </button>
                
                <div class="h-8 w-px bg-gray-200"></div>
                
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">All Skills</h1>
                    <p class="text-gray-500">Manage all service skills & categories</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="bg-emerald-100 px-6 py-3 rounded-2xl text-center min-w-[160px]">
                    <p class="text-sm text-emerald-600">Total Skills</p>
                    <p class="text-3xl font-bold text-emerald-700">{{ total_skills | default(42) }}</p>
                </div>
                <a href="/auth/add-skill" 
                   class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl flex items-center gap-2 font-medium transition-all">
                    <i class="fas fa-plus"></i> 
                    <span>Add Skill</span>
                </a>
            </div>
        </div>

        <!-- Search & Category Filter -->
        <div class="mt-8 flex flex-col md:flex-row gap-4">
            <div class="flex-1 relative">
                <i class="fas fa-search absolute left-4 top-4 text-gray-400"></i>
                <input type="text" id="searchInput"
                       placeholder="Search Skill Name..."
                       class="w-full pl-12 pr-4 py-4 border border-gray-200 rounded-3xl focus:outline-none focus:border-blue-500 text-base">
            </div>

            <select id="categoryFilter" onchange="filterSkills()" 
                    class="w-full md:w-72 px-5 py-4 border border-gray-200 rounded-3xl focus:outline-none focus:border-blue-500 bg-white">
                <option value="">All Categories</option>
                <option value="Web Development">Web Development</option>
                <option value="Tally & GST">Tally & GST</option>
                <option value="Python">Python Programming</option>
                <option value="Graphic Design">Graphic Designing</option>
                <option value="Basic Computer">Basic Computer</option>
                <option value="Electrician">Electrician</option>
                <option value="Plumber">Plumber</option>
                <option value="Painter">Painter</option>
            </select>
        </div>
    </div>

    <!-- Skills Table -->
    <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="table-container">
            <table class="w-full min-w-[800px]">
                <thead class="bg-gradient-to-r from-slate-800 to-slate-900 text-white sticky top-0">
                    <tr>
                        <th class="px-6 py-5 text-left">ID</th>
                        <th class="px-6 py-5 text-left">Skill Name</th>
                        <th class="px-6 py-5 text-left">Category</th>
                        <th class="px-6 py-5 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100">
                    {% for skill in skills %}
                    <tr class="hover:bg-slate-50 transition-all" data-category="{{ skill.category }}">
                        <td class="px-6 py-5 font-medium">{{ skill.id }}</td>
                        <td class="px-6 py-5 font-semibold">{{ skill.skill_name }}</td>
                        <td class="px-6 py-5 text-slate-600">{{ skill.category }}</td>
                        <td class="px-6 py-5 text-center">
                            <div class="flex justify-center gap-3">
                                <a href="/auth/all-skills/{{skill.id}}/edit" 
                                   class="action-btn bg-blue-500 hover:bg-blue-600 text-white px-5 py-3 rounded-2xl">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a href="/auth/skill/{{skill.id}}/delete" 
                                   onclick="return confirm('Are you sure you want to delete this skill?')"
                                   class="action-btn bg-red-500 hover:bg-red-600 text-white px-5 py-3 rounded-2xl">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function filterSkills() {
        const searchTerm = document.getElementById("searchInput").value.toLowerCase();
        const selectedCategory = document.getElementById("categoryFilter").value;

        const rows = document.querySelectorAll("#tableBody tr");

        rows.forEach(row => {
            const rowText = row.textContent.toLowerCase();
            const rowCategory = row.getAttribute("data-category");

            const matchSearch = rowText.includes(searchTerm);
            const matchCategory = !selectedCategory || rowCategory === selectedCategory;

            row.style.display = (matchSearch && matchCategory) ? "" : "none";
        });
    }

    // Live search
    document.getElementById("searchInput").addEventListener("keyup", filterSkills);

    // Back Button
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = '/dashboard';
        }
    }

    // Keyboard shortcut: Press '/' to focus search
    document.addEventListener('keydown', function(e) {
        if (e.key === '/' && document.getElementById('searchInput') !== document.activeElement) {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
    });
</script>

</body>
</html>
