<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | LabourMitra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { 
            font-family: 'Poppins', sans-serif; 
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-600 to-indigo-700 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden">
        
        <!-- Top Accent Bar -->
        <div class="h-2 bg-gradient-to-r from-blue-600 to-indigo-600"></div>

        <div class="p-10">
            
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center shadow-inner">
                    <span class="text-6xl">👷</span>
                </div>
            </div>

            <!-- Title -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Welcome Back Admin</h1>
                <p class="text-gray-500 mt-2 text-[15px]">Sign in to access LabourMitra Dashboard</p>
            </div>

            <form id="loginForm" action="/auth/login-page" method="post" class="space-y-6">
                
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute left-4 top-4 text-gray-400">
                            <i class="fas fa-envelope"></i>
                        </span>
                        <input 
                            type="email" 
                            name="email" 
                            placeholder="admin@labourmitra.com"
                            required
                            class="w-full pl-12 pr-4 py-4 bg-gray-100 border border-transparent rounded-2xl focus:outline-none focus:bg-white focus:border-blue-400 text-base">
                    </div>
                </div>

                <!-- Password -->
<div>
    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>

    <div class="relative">

        <span class="absolute left-4 top-4 text-gray-400">
            <i class="fas fa-lock"></i>
        </span>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            class="w-full pl-12 pr-12 py-4 bg-gray-100 border border-transparent rounded-2xl focus:outline-none focus:bg-white focus:border-blue-400 text-base">

        <button
            type="button"
            onclick="togglePassword()"
            class="absolute right-4 top-4 text-gray-400 hover:text-blue-600">
            <i id="eyeIcon" class="fas fa-eye"></i>
        </button>

    </div>
</div>

<!-- Options -->
<div class="flex items-center justify-between text-sm">
    <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" name="remember" class="w-4 h-4 accent-blue-600">
        <span class="text-gray-600">Remember me</span>
    </label>

    <a href="/auth/forgot-password" class="text-blue-600 hover:underline">
        Forgot Password?
    </a>
</div>

<!-- Login Button -->
<button
    type="submit"
    id="loginBtn"
    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600
           hover:from-blue-700 hover:to-indigo-700
           text-white py-4 rounded-2xl font-semibold text-lg
           shadow-md flex items-center justify-center gap-3">

    <span id="btnText">
        <i class="fas fa-sign-in-alt"></i>
        Sign In
    </span>

    <span
        id="loader"
        class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin">
    </span>

</button>


        <!-- Footer -->
        <div class="text-center py-5 text-xs text-gray-400 border-t">
            © 2026 LabourMitra Admin Panel. All Rights Reserved.
        </div>
    </div>

<script>
   const form = document.getElementById("loginForm");
const btn = document.getElementById("loginBtn");
const btnText = document.getElementById("btnText");
const loader = document.getElementById("loader");

form.addEventListener("submit", function () {
    btn.disabled = true;

    btnText.classList.add("hidden");
    loader.classList.remove("hidden");
});

    function togglePassword() {
        const password = document.getElementById("password");
        const eye = document.getElementById("eyeIcon");
        
        if (password.type === "password") {
            password.type = "text";
            eye.classList.remove("fa-eye");
            eye.classList.add("fa-eye-slash");
        } else {
            password.type = "password";
            eye.classList.remove("fa-eye-slash");
            eye.classList.add("fa-eye");
        }
    }
</script>

</body>
</html>
