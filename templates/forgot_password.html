<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MistriPoint Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system_ui, sans-serif;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }
        
        .input-focus {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-focus:focus {
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        
        .strength-bar {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center overflow-hidden relative">

    <!-- Background Gradient -->
    <div class="absolute inset-0 bg-[radial-gradient(at_50%_30%,rgba(59,130,246,0.12),transparent_70%)]"></div>

    <div class="max-w-md w-full mx-auto px-6 py-12 relative z-10">
        <div class="glass border border-white/10 rounded-3xl p-10 shadow-2xl">
            
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-blue-600 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-hard-hat text-3xl text-white"></i>
                    </div>
                    <div class="text-3xl font-bold text-zinc-900 tracking-tighter">MistriPoint</div>
                </div>
            </div>

            <div class="text-center mb-10">
                <h1 class="text-3xl font-semibold text-zinc-900">Reset Password</h1>
                <p class="text-zinc-500 mt-2">Create a new secure password</p>
            </div>

            <!-- Step 1: Email -->
            <div id="step1" class="space-y-6">
                <button onclick="goBackToLogin()" 
                        class="flex items-center gap-2 text-zinc-500 hover:text-zinc-700 mb-4">
                    <i class="fas fa-arrow-left"></i>
                    <span class="text-sm font-medium">Back to Login</span>
                </button>

                <div>
                    <label class="block text-sm font-medium text-zinc-700 mb-2">Email Address</label>
                    <input type="email" id="email" placeholder="admin@mistripoint.com" required
                           class="w-full px-5 py-4 bg-white border border-zinc-200 rounded-2xl focus:outline-none focus:border-blue-500 input-focus">
                </div>
                <button
                    type="button"
                    id="sendOtpBtn"
                    onclick="sendOTP()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-semibold transition-all duration-300">
                    <span id="sendOtpText">Send OTP</span>
                    <span id="sendOtpLoader" class="hidden">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
            </div>

            <!-- Step 2: OTP -->
<div id="step2" class="hidden space-y-6">
    <button onclick="goBack(1)" 
                        class="flex items-center gap-2 text-zinc-500 hover:text-zinc-700 mb-4">
                    <i class="fas fa-arrow-left"></i>
                    <span class="text-sm font-medium">Back</span>
                </button>
    <div>
        <label class="block text-sm font-medium text-zinc-700 mb-2">
            Enter 6-digit OTP
        </label>

        <input
            type="text"
            id="otp"
            maxlength="6"
            placeholder="123456"
            required
            inputmode="numeric"
            pattern="[0-9]{6}"
            class="w-full text-center text-4xl tracking-[18px] py-5 bg-white border border-zinc-300 rounded-2xl focus:outline-none focus:border-blue-500 font-mono">
    </div>

    <div class="grid grid-cols-2 gap-4">
        <button
            type="button"
            onclick="verifyOTP()"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-semibold">
            Verify OTP
        </button>

        <button
            type="button"
            id="resendBtn"
            onclick="resendOTP()"
            class="w-full border border-zinc-300 bg-white hover:bg-zinc-100 rounded-2xl py-4 font-semibold">
            <div>Resend OTP</div>
            <div id="countdown" class="text-xs text-gray-500 mt-1">(60s)</div>
        </button>
    </div>
</div>

            <!-- Step 3: New Password -->
            <div id="step3" class="hidden space-y-6">
                <button onclick="goBack(2)" 
                        class="flex items-center gap-2 text-zinc-500 hover:text-zinc-700 mb-4">
                    <i class="fas fa-arrow-left"></i>
                    <span class="text-sm font-medium">Back</span>
                </button>
                <form action="/auth/reset-password" method="post" class="space-y-6">
                    <input type="hidden" name="email" id="hiddenEmail">
                    <input type="hidden" name="otp" id="hiddenOtp">

                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">New Password</label>
                        <div class="relative">
                            <input
                                type="password"
                                id="newPassword"
                                name="new_password"
                                required
                                class="w-full px-5 py-4 border border-zinc-300 rounded-2xl focus:outline-none focus:border-blue-500 pr-12">
                            <button type="button" onclick="togglePassword('newPassword')" 
                                    class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600">
                                <i id="eyeNew" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-zinc-700 mb-2">Confirm Password</label>
                        <div class="relative">
                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirm_password"
                                required
                                class="w-full px-5 py-4 border border-zinc-300 rounded-2xl focus:outline-none focus:border-blue-500 pr-12">
                            <button type="button" onclick="togglePassword('confirmPassword')" 
                                    class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600">
                                <i id="eyeConfirm" class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button
                        type="submit"
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-4 rounded-2xl font-semibold">
                        Reset Password
                    </button>

                    <!-- Password Strength -->
                    <div>
                        <div class="flex justify-between text-xs text-zinc-500 mb-2">
                            <span>Password Strength</span>
                            <span id="strengthText" class="font-medium">Weak</span>
                        </div>
                        <div class="h-2 bg-zinc-200 rounded-full overflow-hidden">
                            <div id="strengthBar"
                                 class="h-2 bg-red-500 rounded-full w-1/4 transition-all strength-bar">
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Footer -->
            <div class="text-center mt-10 text-xs text-zinc-500">
                © 2026 MistriPoint. All rights reserved.
            </div>
        </div>
    </div>

<script>
    let countdownInterval;
    // Back Functions
    function goBack(step) {
        if (step === 1) {
            document.getElementById("step2").classList.add("hidden");
            document.getElementById("step1").classList.remove("hidden");
        } else if (step === 2) {
            document.getElementById("step3").classList.add("hidden");
            document.getElementById("step2").classList.remove("hidden");
        }
    }

    async function sendOTP() {
        const email = document.getElementById("email").value.trim();
        if (!email) {
            alert("Please enter your email address");
            return;
        }

        const btn = document.getElementById("sendOtpBtn");
        const text = document.getElementById("sendOtpText");
        const loader = document.getElementById("sendOtpLoader");

        btn.disabled = true;
        text.classList.add("hidden");
        loader.classList.remove("hidden");

        const formData = new FormData();
        formData.append("email", email);

        try {
            const response = await fetch("/auth/send-otp", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                alert(data.message || "OTP sent successfully!");
                document.getElementById("step1").classList.add("hidden");
                document.getElementById("step2").classList.remove("hidden");
                startCountdown();
            } else {
                alert(data.detail || "Failed to send OTP");
                btn.disabled = false;
                text.classList.remove("hidden");
                loader.classList.add("hidden");
            }
        } catch (err) {
            alert("Server Error. Please try again.");
            btn.disabled = false;
            text.classList.remove("hidden");
            loader.classList.add("hidden");
        }
    }

    function startCountdown() {
        clearInterval(countdownInterval);
        let time = 60;
        const countdownEl = document.getElementById('countdown');
        
        countdownEl.textContent = `(${time}s)`;
        
        countdownInterval = setInterval(() => {
            time--;
            countdownEl.textContent = `(${time}s)`;
            if (time <= 0) {
                clearInterval(countdownInterval);
                countdownEl.textContent = '';
            }
        }, 1000);
    }

    async function verifyOTP() {
        const otp = document.getElementById("otp").value.trim();

        if (otp.length !== 6) {
            alert("Please enter a valid 6-digit OTP");
            return;
        }

        const formData = new FormData();
        formData.append("otp", otp);

        try {
            const response = await fetch("/auth/verify-otp", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById("hiddenEmail").value = document.getElementById("email").value;
                document.getElementById("hiddenOtp").value = otp;

                document.getElementById("step2").classList.add("hidden");
                document.getElementById("step3").classList.remove("hidden");
                alert(data.message || "OTP verified successfully!");
            } else {
                alert(data.detail || "Invalid OTP");
            }
        } catch (err) {
            alert("Verification failed. Please try again.");
        }
    }

    function resendOTP() {
        alert("✅ New OTP has been sent to your registered email.");
        startCountdown();
        // You can add actual resend logic here later
    }

    function togglePassword(id) {
        const field = document.getElementById(id);
        const iconId = id === 'newPassword' ? 'eyeNew' : 'eyeConfirm';
        const icon = document.getElementById(iconId);
        
        if (field.type === "password") {
            field.type = "text";
            icon.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            field.type = "password";
            icon.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function checkPasswordStrength() {
        const password = document.getElementById('newPassword').value;
        const bar = document.getElementById('strengthBar');
        const text = document.getElementById('strengthText');
        
        let strength = 0;
        if (password.length >= 8) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        
        const percentage = (strength / 5) * 100;
        bar.style.width = `${percentage}%`;
        
        if (strength <= 2) {
            bar.style.backgroundColor = '#ef4444';
            text.textContent = 'Weak';
        } else if (strength <= 3) {
            bar.style.backgroundColor = '#eab308';
            text.textContent = 'Medium';
        } else {
            bar.style.backgroundColor = '#22c55e';
            text.textContent = 'Strong';
        }
    }

    // Form Validation
    document.querySelector("form").addEventListener("submit", function(e) {
        const newPass = document.getElementById("newPassword").value;
        const confirm = document.getElementById("confirmPassword").value;

        if (newPass.length < 8) {
            e.preventDefault();
            alert("Password must be at least 8 characters.");
            return;
        }

        if (newPass !== confirm) {
            e.preventDefault();
            alert("Passwords do not match.");
            return;
        }
    });

    // Real-time strength check
    document.getElementById('newPassword').addEventListener('input', checkPasswordStrength);
</script>

</body>
</html>
