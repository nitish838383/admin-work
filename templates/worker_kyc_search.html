<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate Worker KYC Report - MistriPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-auto">
        <div class="bg-white rounded-3xl shadow-xl p-10">

            <!-- Logo & Header -->
            <div class="flex items-center gap-3 mb-8">
                <div class="w-11 h-11 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold">MP</div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">MistriPoint</h1>
                    <p class="text-xs text-blue-600 tracking-widest">ADMIN PORTAL</p>
                </div>
            </div>

            <h2 class="text-3xl font-semibold text-gray-800 mb-2">Worker KYC Report</h2>
            <p class="text-gray-500 mb-8">Generate complete KYC verification document</p>

            <!-- Input -->
            <div class="mb-8">
                <label class="block text-sm font-medium text-gray-600 mb-2">Worker ID</label>
                <div class="relative">
                    <input 
                        id="workerId"
                        type="text"
                        placeholder="WRK-12345"
                        class="w-full border border-gray-300 focus:border-blue-500 focus:ring-blue-200 rounded-2xl px-5 py-4 outline-none text-lg">
                    <i class="fa-solid fa-id-card absolute right-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>

            <!-- Button -->
            <button 
                onclick="generateReport()"
                id="generateBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 transition-all text-white font-semibold py-4 rounded-2xl flex items-center justify-center gap-3 shadow-lg shadow-blue-300">
                <i class="fa-solid fa-file-pdf"></i>
                <span id="btnText">Generate PDF Report</span>
            </button>

            <p class="text-center text-xs text-gray-400 mt-8">
                System will generate a professional PDF with all KYC documents
            </p>
        </div>
    </div>

    <script>
        function generateReport() {
            const input = document.getElementById("workerId");
            const workerId = input.value.trim();
            const btn = document.getElementById("generateBtn");
            const btnText = document.getElementById("btnText");

            if (workerId === "") {
                input.classList.add("!border-red-500");
                setTimeout(() => input.classList.remove("!border-red-500"), 2000);
                alert("Please enter Worker ID");
                input.focus();
                return;
            }

            // Loading state
            btn.disabled = true;
            btnText.innerHTML = `
                <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                Generating...
            `;

            // Redirect to backend
            window.location.href = `/auth/download-pdf?type=kyc&worker_id=${encodeURIComponent(workerId)}`;

            // Reset button (in case navigation fails)
            setTimeout(() => {
                btn.disabled = false;
                btnText.innerHTML = `Generate PDF Report`;
            }, 3000);
        }

        // Enter key support
        document.getElementById("workerId").addEventListener("keypress", (e) => {
            if (e.key === "Enter") generateReport();
        });
    </script>
</body>
</html>
