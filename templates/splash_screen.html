<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistriPoint - Loading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        :root {
            --primary: 59 130 246;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .logo-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
        }

        .dark .glass {
            background: rgba(15, 23, 42, 0.85);
        }

        .gradient-bg {
            background: linear-gradient(-45deg, #3b82f6, #8b5cf6, #6366f1, #3b82f6);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-25px); }
        }

        .pulse-glow {
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 30px -5px rgb(59 130 246); }
            50% { box-shadow: 0 0 50px 15px rgb(139 92 246); }
        }

        .loading-text {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.6);
            animation: particleFloat 8s linear infinite;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center overflow-hidden relative text-slate-900 dark:text-slate-100">
    
    <!-- Background Elements -->
    <div class="absolute inset-0 overflow-hidden">
        <!-- Blur Orbs -->
        <div class="absolute top-20 left-20 w-96 h-96 bg-blue-500 rounded-full mix-blend-screen filter blur-3xl opacity-20"></div>
        <div class="absolute bottom-20 right-20 w-96 h-96 bg-purple-500 rounded-full mix-blend-screen filter blur-3xl opacity-20"></div>
        
        <!-- Floating Particles -->
        <div id="particles" class="absolute inset-0"></div>
    </div>

    <!-- Main Splash Container -->
    <div class="relative z-10 w-full max-w-md mx-auto px-6">
        <div class="glass rounded-3xl shadow-2xl p-10 lg:p-12 border border-white/30 dark:border-white/10">
            
            <!-- Top Logo -->
            <div class="flex flex-col items-center mb-10">
                <div class="relative mb-6">
                    <div id="logo" 
                         class="w-24 h-24 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl flex items-center justify-center text-white text-5xl font-bold logo-font shadow-xl float pulse-glow">
                        M
                    </div>
                    <div class="absolute -inset-4 border border-white/30 dark:border-white/20 rounded-3xl animate-spin" style="animation-duration: 8s;"></div>
                </div>
                
                <div class="text-center">
                    <h1 class="text-4xl font-bold tracking-tighter logo-font text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">
                        MistriPoint
                    </h1>
                    <p class="text-slate-500 dark:text-slate-400 mt-1 text-sm tracking-wide">HOME SERVICES MANAGEMENT</p>
                </div>
            </div>

            <!-- Central Animated Logo -->
            <div class="flex justify-center mb-10">
                <div class="relative">
                    <div id="main-logo" 
                         class="w-32 h-32 bg-white dark:bg-slate-800 rounded-3xl flex items-center justify-center text-7xl shadow-2xl border border-white/50 dark:border-slate-700 float">
                        🛠️
                    </div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="w-40 h-40 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                </div>
            </div>

            <!-- Loading Status -->
            <div class="text-center mb-8">
                <div id="loading-text" class="loading-text text-lg font-medium text-slate-600 dark:text-slate-300 h-8">
                    Initializing...
                </div>
                <div class="text-xs text-slate-400 dark:text-slate-500 mt-1 tracking-widest" id="status">PREPARING DASHBOARD</div>
            </div>

            <!-- Progress Bar -->
            <div class="relative h-2.5 bg-slate-200 dark:bg-slate-700 rounded-3xl overflow-hidden mb-6">
                <div id="progress-bar" 
                     class="progress-bar absolute top-0 left-0 h-full bg-gradient-to-r from-blue-500 to-purple-600 rounded-3xl"
                     style="width: 0%"></div>
            </div>

            <!-- Percentage -->
            <div class="flex justify-between items-center text-sm mb-8">
                <div class="font-mono text-slate-500 dark:text-slate-400">LOADING</div>
                <div id="percentage" class="font-mono font-semibold text-blue-600 dark:text-blue-400">0%</div>
            </div>

            <!-- Bottom Info -->
            <div class="text-center text-xs text-slate-400 dark:text-slate-500 border-t border-slate-200 dark:border-slate-700 pt-6">
                <div class="flex justify-center gap-6">
                    <div>v2.4.1</div>
                    <div>© 2026 MistriPoint</div>
                </div>
                <div class="mt-2 text-[10px] tracking-widest">POWERED BY MISTRIPOINT TECHNOLOGIES</div>
            </div>
        </div>
    </div>

    <script>
        // Tailwind script ready
        function initTailwind() {
            // Already loaded via CDN
        }

        // Loading messages
        const messages = [
            "Initializing...",
            "Loading Assets...",
            "Connecting Database...",
            "Fetching Services...",
            "Preparing Dashboard...",
            "Verifying Security...",
            "Almost Ready...",
            "Welcome Admin..."
        ];

        let progress = 0;
        let messageIndex = 0;
        let isComplete = false;

        function updateLoading() {
            if (isComplete) return;

            progress += Math.random() * 8 + 3;
            if (progress > 100) progress = 100;

            // Update progress bar and percentage
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('percentage').textContent = `${Math.floor(progress)}%`;

            // Change message
            if (Math.random() > 0.7 && messageIndex < messages.length - 1) {
                messageIndex++;
                const loadingText = document.getElementById('loading-text');
                loadingText.style.opacity = 0;
                
                setTimeout(() => {
                    loadingText.textContent = messages[messageIndex];
                    loadingText.style.opacity = 1;
                }, 300);
            }

            // Complete loading
            if (progress >= 100) {
                completeLoading();
            } else {
                setTimeout(updateLoading, 120);
            }
        }

        function completeLoading() {
            isComplete = true;
            const loadingText = document.getElementById('loading-text');
            loadingText.textContent = "Welcome Admin!";
            loadingText.classList.add('text-emerald-500');

            // Final animation
            setTimeout(() => {
                document.querySelector('.glass').classList.add('scale-95', 'opacity-0');
                
                setTimeout(() => {
                    // Redirect to dashboard
                    window.location.href = "/auth/dashboard";
                }, 800);
            }, 1200);
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 6 + 3;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.opacity = Math.random() * 0.5 + 0.2;
                particle.style.animationDuration = `${Math.random() * 12 + 8}s`;
                particle.style.animationDelay = `-${Math.random() * 10}s`;
                
                container.appendChild(particle);
            }
        }

        // Keyboard shortcut to skip (for demo)
        function addKeyboardSupport() {
            document.addEventListener('keydown', (e) => {
                if (e.key === "s" || e.key === "S") {
                    document.getElementById('progress-bar').style.width = '100%';
                    document.getElementById('percentage').textContent = '100%';
                    completeLoading();
                }
            });
        }

        // Initialize
        window.onload = function() {
            createParticles();
            addKeyboardSupport();
            
            // Start loading
            setTimeout(() => {
                updateLoading();
            }, 600);

            console.log('%cMistriPoint Splash Screen Loaded ✨', 'color:#3b82f6; font-weight:bold; font-size:13px');
        };
    </script>
</body>
</html>
