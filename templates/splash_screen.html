<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistriPoint - Loading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .runner {
            animation: run 0.7s steps(4) infinite;
            font-size: 5.5rem;
        }
        
        @keyframes run {
            0% { transform: translateX(-25px); }
            100% { transform: translateX(25px); }
        }
        
        .progress-bar {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px #facc15;
        }
        
        .particle {
            position: absolute;
            background: #facc15;
            border-radius: 50%;
            opacity: 0.6;
            animation: particleFloat 4s linear infinite;
        }
        
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0.7; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-zinc-900 to-black text-white overflow-hidden flex items-center justify-center min-h-screen relative">

    <!-- Background Particles -->
    <div id="particles" class="absolute inset-0 pointer-events-none"></div>

    <div class="text-center px-6 w-full max-w-md z-10">
        <!-- Cartoon Runner -->
        <div class="flex justify-center mb-8">
            <div class="relative w-40 h-40 flex items-center justify-center">
                <div id="runner" class="runner">🏃‍♂️</div>
                <div class="absolute -bottom-2 text-yellow-400 text-3xl animate-bounce">💨</div>
            </div>
        </div>

        <h1 class="text-5xl sm:text-6xl font-black tracking-tighter">MISTRIPOINT</h1>
        <p class="text-amber-400 text-lg sm:text-xl mt-2">Worker Booking Platform</p>

        <!-- Progress -->
        <div class="mt-16 w-full max-w-xs mx-auto">
            <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
                <div id="progress-bar" class="progress-bar h-2 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 rounded-full"></div>
            </div>
            <div class="flex justify-between text-sm mt-4 text-zinc-400">
                <span id="status">Initializing...</span>
                <span id="percent">0%</span>
            </div>
        </div>

        <p class="text-zinc-500 mt-12 text-sm">Please wait while we prepare your admin portal</p>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const percentEl = document.getElementById('percent');
        const statusEl = document.getElementById('status');
        const runner = document.getElementById('runner');

        const statusMessages = [
            "Initializing...",
            "Connecting to Server...",
            "Loading Customers...",
            "Loading Workers...",
            "Loading Bookings...",
            "Loading Notifications...",
            "Preparing Dashboard...",
            "Almost Ready..."
        ];

        let messageIndex = 0;
        let lastSpeed = 0;

        const stages = [4, 9, 15, 23, 35, 48, 61, 74, 82, 89, 93, 95];
        let stageIndex = 0;

        const interval = setInterval(() => {
            // Gradual increase
            if (stageIndex < stages.length) {
                const target = stages[stageIndex];
                if (progress < target) {
                    progress += Math.random() * 3 + 1.5;
                } else {
                    stageIndex++;
                }
            } else {
                progress += Math.random() * 1.2; // Very slow after 95%
            }

            if (progress > 95) progress = 95;

            progressBar.style.width = `${progress}%`;
            percentEl.textContent = `${Math.floor(progress)}%`;

            // Dynamic runner speed
            const speed = Math.min(1.8, 0.7 + (progress / 70));
            if (Math.abs(speed - lastSpeed) > 0.1) {
                runner.style.animationDuration = `${speed}s`;
                lastSpeed = speed;
            }

            // Status message change
            if (Math.random() > 0.88) {
                messageIndex = (messageIndex + 1) % statusMessages.length;
                statusEl.textContent = statusMessages[messageIndex];
            }

            // Final push to 100%
            if (progress >= 95 && Math.random() > 0.7) {
                clearInterval(interval);
                progress = 100;
                progressBar.style.width = "100%";
                percentEl.textContent = "100%";
                statusEl.textContent = "Launching Dashboard...";

                setTimeout(() => {
                    window.location.href = "/auth/dashboard";
                }, 600);
            }
        }, 90);

        // Floating Particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 6 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.bottom = `-20px`;
            particle.style.opacity = Math.random() * 0.6 + 0.3;
            
            document.getElementById('particles').appendChild(particle);
            
            setTimeout(() => {
                particle.style.transition = 'all 4s linear';
                particle.style.transform = `translateY(-${window.innerHeight + 100}px)`;
                particle.style.opacity = '0';
            }, 50);
            
            setTimeout(() => particle.remove(), 4500);
        }

        setInterval(createParticle, 40);
    </script>
</body>
</html>
