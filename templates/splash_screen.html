<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistriPoint - Loading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .runner {
            animation: run 0.7s steps(4) infinite;
            font-size: 5.5rem;
        }
        
        @keyframes run {
            0% { transform: translateX(-25px); }
            100% { transform: translateX(25px); }
        }
        
        .loading-bar {
            animation: loading 2.8s linear forwards;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-zinc-900 to-black text-white overflow-hidden flex items-center justify-center min-h-screen relative">

    <div class="text-center px-6 w-full max-w-md">
        <!-- Cartoon Runner -->
        <div class="flex justify-center mb-8">
            <div class="relative w-40 h-40 flex items-center justify-center">
                <div class="runner">🏃‍♂️</div>
                <div class="absolute -bottom-2 text-yellow-400 text-3xl animate-bounce">💨</div>
            </div>
        </div>

        <h1 class="text-5xl sm:text-6xl font-black tracking-tighter">MISTRIPOINT</h1>
        <p class="text-amber-400 text-lg sm:text-xl mt-2">Worker Booking Platform</p>

        <!-- Real-Time Progress -->
        <div class="mt-16 w-full max-w-xs mx-auto">
            <div class="h-2 bg-zinc-800 rounded-full overflow-hidden">
                <div id="progress-bar" class="loading-bar h-2 bg-gradient-to-r from-yellow-400 to-amber-500 rounded-full"></div>
            </div>
            <div class="flex justify-between text-sm mt-4 text-zinc-400">
                <span id="status">Running to dashboard...</span>
                <span id="percent">0%</span>
            </div>
        </div>

        <p class="text-zinc-500 mt-12 text-sm">Please wait while we prepare your admin portal</p>
    </div>

    <script>
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const percentEl = document.getElementById('percent');
        const statusEl = document.getElementById('status');

        const statuses = [
            "Running to dashboard...",
            "Fetching workers...",
            "Loading bookings...",
            "Preparing your portal..."
        ];

        let statusIndex = 0;

        const interval = setInterval(() => {
            progress += Math.random() * 14 + 7;
            if (progress > 100) progress = 100;

            progressBar.style.width = `${progress}%`;
            percentEl.textContent = `${Math.floor(progress)}%`;

            // Change status text dynamically
            if (Math.random() > 0.85) {
                statusIndex = (statusIndex + 1) % statuses.length;
                statusEl.textContent = statuses[statusIndex];
            }

            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    window.location.href = "/auth/dashboard";
                }, 700);
            }
        }, 65);
    </script>
</body>
</html>
