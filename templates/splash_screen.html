<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MistriPoint – Loading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --c1: #0D9488;   /* teal */
      --c2: #06B6D4;   /* cyan */
      --c3: #10B981;   /* emerald */
      --c4: #F59E0B;   /* amber accent */
      --bg: #0B1220;
      --card: rgba(15, 23, 42, 0.72);
      --text: #F1F5F9;
      --muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated mesh background */
    .bg-mesh {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(13,148,136,0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 80% 70%, rgba(6,182,212,0.28), transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 10%, rgba(245,158,11,0.12), transparent 45%),
        linear-gradient(160deg, #0B1220 0%, #0F172A 50%, #042F2E 100%);
      animation: meshMove 18s ease-in-out infinite alternate;
    }
    @keyframes meshMove {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(25deg); }
    }

    /* Grid overlay */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.45;
      animation: drift 12s ease-in-out infinite;
    }
    .orb-1 {
      width: 280px; height: 280px;
      background: var(--c1);
      top: -60px; left: -40px;
    }
    .orb-2 {
      width: 220px; height: 220px;
      background: var(--c2);
      bottom: -40px; right: -30px;
      animation-delay: -4s;
    }
    .orb-3 {
      width: 160px; height: 160px;
      background: var(--c4);
      top: 40%; right: 15%;
      animation-delay: -7s;
      opacity: 0.25;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.08); }
    }

    /* Card */
    .splash {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      margin: 24px;
      padding: 40px 36px 32px;
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      box-shadow:
        0 0 0 1px rgba(13,148,136,0.15),
        0 25px 60px -15px rgba(0,0,0,0.55);
      text-align: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .splash.exit {
      opacity: 0;
      transform: scale(0.94) translateY(12px);
    }

    .brand {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #5EEAD4, #22D3EE, #34D399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 36px;
    }

    /* Advanced multi-ring spinner */
    .spinner-wrap {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 32px;
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }
    .ring-1 {
      border-top-color: var(--c1);
      border-right-color: var(--c1);
      animation: spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }
    .ring-2 {
      inset: 10px;
      border-bottom-color: var(--c2);
      border-left-color: var(--c2);
      animation: spin 1.4s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
    }
    .ring-3 {
      inset: 22px;
      border-top-color: var(--c3);
      animation: spin 0.9s linear infinite;
    }
    .ring-core {
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      background: linear-gradient(145deg, #134E4A, #0F766E);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.3), 0 0 20px rgba(13,148,136,0.4);
      animation: pulseCore 2s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); box-shadow: inset 0 2px 8px rgba(0,0,0,0.3), 0 0 20px rgba(13,148,136,0.4); }
      50% { transform: scale(1.06); box-shadow: inset 0 2px 8px rgba(0,0,0,0.3), 0 0 32px rgba(6,182,212,0.55); }
    }

    /* Stage list (real-world steps) */
    .stages {
      text-align: left;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stage {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.35s ease;
      opacity: 0.4;
    }
    .stage.active {
      opacity: 1;
      background: rgba(13,148,136,0.12);
      border-color: rgba(13,148,136,0.35);
    }
    .stage.done {
      opacity: 0.85;
      background: rgba(16,185,129,0.08);
      border-color: rgba(16,185,129,0.2);
    }
    .stage-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      background: rgba(255,255,255,0.06);
      color: var(--muted);
    }
    .stage.active .stage-icon {
      background: linear-gradient(135deg, var(--c1), var(--c2));
      color: #fff;
      animation: iconPulse 0.8s ease infinite;
    }
    .stage.done .stage-icon {
      background: var(--c3);
      color: #fff;
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    .stage-label {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 500;
    }
    .stage-status {
      font-size: 0.7rem;
      font-family: ui-monospace, monospace;
      color: var(--muted);
    }
    .stage.active .stage-status { color: var(--c2); }
    .stage.done .stage-status { color: var(--c3); }

    /* Progress */
    .progress-track {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(13,148,136,0.5);
    }
    @keyframes shimmer {
      0% { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-family: ui-monospace, monospace;
      color: var(--muted);
      margin-bottom: 24px;
    }
    #pct { color: #5EEAD4; font-weight: 600; }

    .footer-meta {
      font-size: 0.65rem;
      color: #64748B;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 16px;
    }

    /* Mini dots loader under active stage */
    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    @media (max-width: 420px) {
      .splash { padding: 32px 22px 24px; margin: 16px; }
      .spinner-wrap { width: 100px; height: 100px; margin-bottom: 24px; }
      .ring-core { font-size: 1.35rem; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="splash" id="splash">
    <div class="brand">MistriPoint</div>
    <div class="tagline">Home Services Management</div>

    <!-- Triple-ring spinner -->
    <div class="spinner-wrap" aria-hidden="true">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring-core"><i class="fas fa-tools"></i></div>
    </div>

    <!-- Real-world stages -->
    <div class="stages" id="stages">
      <div class="stage" data-stage="0">
        <div class="stage-icon"><i class="fas fa-shield-halved"></i></div>
        <div class="stage-label">Security check</div>
        <div class="stage-status" data-st>WAIT</div>
      </div>
      <div class="stage" data-stage="1">
        <div class="stage-icon"><i class="fas fa-database"></i></div>
        <div class="stage-label">Connecting services</div>
        <div class="stage-status" data-st>WAIT</div>
      </div>
      <div class="stage" data-stage="2">
        <div class="stage-icon"><i class="fas fa-cloud-arrow-down"></i></div>
        <div class="stage-label">Syncing bookings</div>
        <div class="stage-status" data-st>WAIT</div>
      </div>
      <div class="stage" data-stage="3">
        <div class="stage-icon"><i class="fas fa-gauge-high"></i></div>
        <div class="stage-label">Building dashboard</div>
        <div class="stage-status" data-st>WAIT</div>
      </div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" id="bar"></div>
    </div>
    <div class="progress-meta">
      <span id="phase">INITIALIZING</span>
      <span id="pct">0%</span>
    </div>

    <div class="footer-meta">v2.4.1 · © 2026 MistriPoint</div>
  </div>

  <script>
    (function () {
      const stages = [
        { label: 'Security check', phase: 'AUTH', duration: [600, 1100] },
        { label: 'Connecting services', phase: 'API', duration: [800, 1400] },
        { label: 'Syncing bookings', phase: 'DATA', duration: [900, 1600] },
        { label: 'Building dashboard', phase: 'UI', duration: [700, 1200] }
      ];

      const bar = document.getElementById('bar');
      const pct = document.getElementById('pct');
      const phase = document.getElementById('phase');
      const splash = document.getElementById('splash');
      const stageEls = document.querySelectorAll('.stage');

      let progress = 0;
      let current = -1;

      function rand(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      function setProgress(value) {
        progress = Math.min(100, Math.max(0, value));
        bar.style.width = progress + '%';
        pct.textContent = Math.floor(progress) + '%';
      }

      function setStage(index, state) {
        // state: 'active' | 'done'
        stageEls.forEach((el, i) => {
          el.classList.remove('active', 'done');
          const st = el.querySelector('[data-st]');
          if (i < index) {
            el.classList.add('done');
            st.textContent = 'OK';
            el.querySelector('.stage-icon').innerHTML = '<i class="fas fa-check"></i>';
          } else if (i === index && state === 'active') {
            el.classList.add('active');
            st.innerHTML = '<span class="dots">RUN</span>';
          } else if (i === index && state === 'done') {
            el.classList.add('done');
            st.textContent = 'OK';
            el.querySelector('.stage-icon').innerHTML = '<i class="fas fa-check"></i>';
          } else {
            st.textContent = 'WAIT';
          }
        });
      }

      function runStage(index) {
        return new Promise((resolve) => {
          current = index;
          setStage(index, 'active');
          phase.textContent = stages[index].phase;

          const [dMin, dMax] = stages[index].duration;
          const duration = rand(dMin, dMax);
          const startPct = (index / stages.length) * 100;
          const endPct = ((index + 1) / stages.length) * 100;
          const startTime = performance.now();

          function tick(now) {
            const t = Math.min(1, (now - startTime) / duration);
            // ease-out
            const eased = 1 - Math.pow(1 - t, 2.2);
            setProgress(startPct + (endPct - startPct) * eased);
            if (t < 1) {
              requestAnimationFrame(tick);
            } else {
              setStage(index, 'done');
              resolve();
            }
          }
          requestAnimationFrame(tick);
        });
      }

      async function boot() {
        // small delay so first paint shows
        await new Promise(r => setTimeout(r, 400));

        for (let i = 0; i < stages.length; i++) {
          await runStage(i);
          await new Promise(r => setTimeout(r, 120));
        }

        setProgress(100);
        phase.textContent = 'READY';
        pct.textContent = '100%';

        await new Promise(r => setTimeout(r, 600));
        splash.classList.add('exit');
        await new Promise(r => setTimeout(r, 550));
        window.location.href = '/auth/dashboard';
      }

      // Skip with "S"
      document.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S') {
          setProgress(100);
          window.location.href = '/auth/dashboard';
        }
      });

      boot();
    })();
  </script>
</body>
</html>
