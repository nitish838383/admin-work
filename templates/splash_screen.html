<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading | LabourMitra Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
        }
        
        .splash-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 50%, #6d28d9 100%);
        }
        
        .glass-circle {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 60px rgba(255,255,255,0.2);
        }
        
        .progress-bar {
            transition: width 2.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            100% { transform: translateY(-100vh) scale(1.2); opacity: 0.6; }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
    </style>
</head>
<body class="splash-bg min-h-screen flex items-center justify-center overflow-hidden relative">

    <!-- Background Particles -->
    <div id="particles" class="absolute inset-0 overflow-hidden"></div>

    <div class="text-center z-10 px-6">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <div class="glass-circle w-32 h-32 rounded-full flex items-center justify-center pulse">
                <span class="text-7xl">👷</span>
            </div>
        </div>

        <!-- Title -->
        <h1 class="text-5xl md:text-6xl font-bold text-white tracking-tighter mb-3">
            LabourMitra
        </h1>
        <p class="text-white/80 text-lg md:text-xl mb-12 max-w-md mx-auto">
            Connecting Skilled Workers with Customers
        </p>

        <!-- Loading Text -->
        <div class="flex items-center justify-center gap-3 mb-6 text-white/90">
            <span class="text-sm font-medium">Loading Dashboard</span>
            <span id="loading-dots" class="text-xl">.</span>
        </div>

        <!-- Progress Container -->
        <div class="max-w-xs mx-auto">
            <div class="h-2 bg-white/20 rounded-full overflow-hidden">
                <div id="progressBar" 
                     class="progress-bar h-full bg-gradient-to-r from-white to-cyan-300 w-0 rounded-full"></div>
            </div>
            
            <!-- Percentage -->
            <div class="flex justify-between text-white/70 text-sm font-medium mt-3">
                <span>0%</span>
                <span id="percentage">0%</span>
            </div>
        </div>
    </div>

<script>
    let progress = 0;
    const progressBar = document.getElementById('progressBar');
    const percentageText = document.getElementById('percentage');
    const loadingDots = document.getElementById('loading-dots');

    // Create floating particles
    function createParticles() {
        const container = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 6 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.animationDuration = `${Math.random() * 12 + 8}s`;
            particle.style.animationDelay = `-${Math.random() * 10}s`;
            particle.style.opacity = Math.random() * 0.5 + 0.2;
            
            container.appendChild(particle);
        }
    }

    // Animate loading dots
    let dots = 0;
    setInterval(() => {
        dots = (dots + 1) % 4;
        loadingDots.textContent = '.'.repeat(dots);
    }, 400);

    // Progress Animation
    function startLoading() {
        const interval = setInterval(() => {
            progress += Math.random() * 6 + 3;
            
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                
                // Fade out and redirect
                setTimeout(() => {
                    document.body.style.transition = 'opacity 0.8s';
                    document.body.style.opacity = '0';
                    
                    setTimeout(() => {
                        window.location.href = "/auth/dashboard"; // Change to your login page
                    }, 800);
                }, 600);
            }
            
            progressBar.style.width = `${progress}%`;
            percentageText.textContent = `${Math.floor(progress)}%`;
        }, 60);
    }

    // Initialize
    window.onload = function() {
        createParticles();
        startLoading();
    };
</script>

</body>
</html>
