<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistriPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .logo-glow {
            animation: glow 2.5s ease-in-out infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 30px #facc15, 0 0 60px #eab308; }
            to { text-shadow: 0 0 50px #facc15, 0 0 90px #eab308, 0 0 120px #ca8a04; }
        }
        
        .loading-bar {
            animation: loading 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes loading {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .particle {
            position: absolute;
            background: linear-gradient(white, #facc15);
            border-radius: 50%;
            box-shadow: 0 0 12px #facc15;
            animation: particleFloat linear infinite;
        }
        
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0.6); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body class="bg-zinc-950 text-white overflow-hidden flex items-center justify-center min-h-screen relative">

    <!-- Particles -->
    <div id="particles" class="absolute inset-0"></div>

    <div class="text-center z-10 px-6 w-full max-w-md">
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <div class="w-28 h-28 sm:w-32 sm:h-32 bg-gradient-to-br from-yellow-300 via-amber-400 to-yellow-600 rounded-3xl flex items-center justify-center text-6xl sm:text-7xl font-black logo-glow shadow-2xl shadow-yellow-500/60 border border-yellow-400/30">
                M
            </div>
        </div>

        <h1 class="text-5xl sm:text-6xl md:text-7xl font-black tracking-[-4px] mb-1">MISTRIPOINT</h1>
        <p class="text-amber-400 text-base sm:text-lg font-medium tracking-widest">WORKER BOOKING PLATFORM</p>

        <!-- Loading Bar -->
        <div class="mt-16 sm:mt-20 w-full max-w-xs mx-auto">
            <div class="h-1 bg-zinc-800 rounded-full overflow-hidden">
                <div class="loading-bar h-1 bg-gradient-to-r from-yellow-400 via-amber-400 to-yellow-500 rounded-full"></div>
            </div>
            <div class="flex justify-between text-xs text-zinc-500 mt-4">
                <span>INITIALIZING SYSTEM...</span>
                <span id="percent">0%</span>
            </div>
        </div>

        <p class="text-zinc-400 mt-12 sm:mt-16 text-sm tracking-wider">WELCOME TO THE ADMIN PORTAL</p>
    </div>

    <script>
        let progress = 0;
        const percentEl = document.getElementById('percent');

        const progressInterval = setInterval(() => {
            progress += Math.random() * 14 + 4;
            if (progress > 100) progress = 100;
            
            percentEl.textContent = Math.floor(progress) + "%";
            
            if (progress >= 100) {
                clearInterval(progressInterval);
                setTimeout(() => {
                    window.location.href = "/auth/dashboard";
                }, 900);
            }
        }, 65);

        // Enhanced Particle System
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 7 + 4;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${Math.random() * 100}vw`;
            particle.style.bottom = `-20px`;
            
            const duration = Math.random() * 3.5 + 2.5;
            particle.style.animationDuration = `${duration}s`;
            
            const delay = Math.random() * -2;
            particle.style.animationDelay = `${delay}s`;
            
            document.getElementById('particles').appendChild(particle);
            
            setTimeout(() => particle.remove(), duration * 1000 + 1000);
        }

        // Spawn particles
        setInterval(createParticle, 25);
        setInterval(createParticle, 35);

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key === "Enter") {
                window.location.href = "/auth/dashboard";
            }
        });
    </script>
</body>
</html>
